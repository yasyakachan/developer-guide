name: Update AI Models

on:
  schedule:
    - cron: '0 6 * * *'  # щодня о 6:00 UTC
  workflow_dispatch:       # також можна запустити вручну

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch models from API
        run: |
          curl -s https://api.macpaw.com/ai/api/v1/model/info > models.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models.json
          git diff --staged --quiet || git commit -m "chore: update models.json"
          git push
